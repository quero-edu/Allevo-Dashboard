# Valores compartilhados por todos os ambientes.
# Os campos abaixo em branco são preenchidos pelo buildspec via --set:
#   global.clusterName, global.appName, global.project.*, image.repository,
#   image.tag, serviceAccount.name/annotations e secret.data.
global:
  clusterName: "" # Name of the cluster
  appName: "" # Name of the application
  project:
    name: "" # Name of the Project
    environment: "" # Environment

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

app:
  containerPort: 3000

  volume:
    mountPath: /app/data
    sizeInGigabytes: 1

  env:
    - name: NODE_ENV
      value: "production"
    - name: DASHBOARD_FUNNELS_SSM_PARAM
      value: "/allevo-dashboard/funnels"
    - name: AWS_REGION
      value: "us-east-1"
    - name: DASHBOARD_FUNNELS_PATH
      value: "/app/data/funnels.json"

  healthCheck:
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  terminationGracePeriodSeconds: 30

service:
  type: NodePort
  port: 3000

secret:
  enabled: true
  data: "" # preenchido pelo buildspec a partir do bag do Secrets Manager

replicaCount: 1
autoscaling:
  mode: Disabled

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
